<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  {% if page.mathjax %}
  <script>
    MathJax = {
      tex: { inlineMath: [['$', '$']] },
      options: { skipHtmlTags: ['script','noscript','style','textarea','pre'] }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
  {% endif %}
</head>
<body>
  <aside class="sidebar">
    {% include sidebar.html %}
  </aside>
  <main class="main-content">
    {{ content }}
  </main>
  {% if page.layout == 'post' %}
  <aside class="toc-sidebar">
    <nav class="toc-nav">
      <p class="toc-title">Table of contents</p>
      <ul class="toc-list" id="toc-list"></ul>
    </nav>
  </aside>
  {% endif %}
  <script>
    (function () {
      var sf = document.getElementById('search-form');
      if (sf) {
        sf.addEventListener('submit', function (e) {
          e.preventDefault();
          var q = document.getElementById('search-input').value.trim();
          if (q) window.open('https://www.google.com/search?q=site%3Avaze-esha.github.io+' + encodeURIComponent(q));
        });
      }

      var tocList = document.getElementById('toc-list');
      if (tocList) {
        var headings = document.querySelectorAll('.post-content h2, .post-content h3');
        headings.forEach(function (h) {
          var li = document.createElement('li');
          var a = document.createElement('a');
          a.href = '#' + h.id;
          a.textContent = h.textContent;
          if (h.tagName === 'H3') li.classList.add('toc-h3');
          li.appendChild(a);
          tocList.appendChild(li);
        });
        var observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              tocList.querySelectorAll('a').forEach(function (a) { a.classList.remove('active'); });
              var active = tocList.querySelector('a[href="#' + entry.target.id + '"]');
              if (active) active.classList.add('active');
            }
          });
        }, { rootMargin: '-10% 0px -80% 0px' });
        headings.forEach(function (h) { observer.observe(h); });
      }
    }());
  </script>
</body>
</html>
