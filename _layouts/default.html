<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  {% if page.mathjax %}
  <script>
    MathJax = {
      tex: { inlineMath: [['$', '$']] },
      options: { skipHtmlTags: ['script','noscript','style','textarea','pre'] }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
  {% endif %}
</head>
<body>
  <aside class="sidebar">
    {% include sidebar.html %}
  </aside>
  <main class="main-content">
    {{ content }}
  </main>
  {% unless page.layout == 'post' %}
  <footer class="site-footer">
    M.C. Escher, &#8220;Gravity&#8221; &mdash; <a href="https://www.digitalcommonwealth.org/search?f%5Bcollection_name_ssim%5D%5B%5D=M.+C.+Escher+%281898-1972%29.+Prints+and+Drawings&f%5Binstitution_name_ssi%5D%5B%5D=Boston+Public+Library">Boston Public Library Digital Commonwealth</a>
  </footer>
  {% endunless %}
  <script>
    (function () {
      var sf = document.getElementById('search-form');
      if (sf) {
        sf.addEventListener('submit', function (e) {
          e.preventDefault();
          var q = document.getElementById('search-input').value.trim();
          if (q) window.open('https://www.google.com/search?q=site%3Avaze-esha.github.io+' + encodeURIComponent(q));
        });
      }

      var tocSection = document.getElementById('sidebar-toc-section');
      if (tocSection && document.querySelector('.post-content')) {
        var headings = document.querySelectorAll('.post-content h2, .post-content h3');
        if (headings.length) {
          var label = document.createElement('p');
          label.className = 'toc-title';
          label.textContent = 'On this page';
          tocSection.appendChild(label);

          var ul = document.createElement('ul');
          ul.className = 'toc-list';
          headings.forEach(function (h) {
            var li = document.createElement('li');
            var a = document.createElement('a');
            a.href = '#' + h.id;
            a.textContent = h.textContent;
            if (h.tagName === 'H3') li.classList.add('toc-h3');
            li.appendChild(a);
            ul.appendChild(li);
          });
          tocSection.appendChild(ul);

          var observer = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                ul.querySelectorAll('a').forEach(function (a) { a.classList.remove('active'); });
                var active = ul.querySelector('a[href="#' + entry.target.id + '"]');
                if (active) active.classList.add('active');
              }
            });
          }, { rootMargin: '-10% 0px -80% 0px' });
          headings.forEach(function (h) { observer.observe(h); });
        }
      }
    }());
  </script>
</body>
</html>
